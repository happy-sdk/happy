name: "Happyvet Monorepo"
description: "Run happyvet static analysis across every module in the monorepo"
inputs:
  go-version:
    description: "The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks."
    required: true
    default: ">=1.27rc2"
  modules:
    description: "JSON array of module directories, as produced by go-test-monorepo-action's only-module-list output"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build happyvet
      shell: bash
      run: go build -o /tmp/happyvet ./tools/happyvet/cmd/happyvet

    - name: Run happyvet on every module
      shell: bash
      run: |
        status=0
        modules='${{ inputs.modules }}'
        while read -r module; do
          echo "::group::happyvet: $module"
          if ! (cd "$module" && /tmp/happyvet ./...); then
            status=1
          fi
          echo "::endgroup::"
        done < <(echo "$modules" | jq -r '.[]')
        exit $status
