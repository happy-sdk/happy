version: "1"

releaser:
  enabled: true

linter:
  golangci-lint:
    # TEMPORARY: staticcheck's SA5012 analyzer panics on go1.27rc2 toolchains
    # ("interface conversion: interface {} is nil, not *buildir.IR") - an
    # upstream golangci-lint/honnef.co/go/tools incompatibility with the
    # go1.27 release candidate, not a real lint failure. Remove this once
    # golangci-lint ships a release built against a stable go1.27.
    disable:
      - staticcheck

deps:
  go:
    latest:
      - charm.land/bubbles/v2
      - charm.land/bubbletea/v2
      - charm.land/lipgloss/v2
      - github.com/fsnotify/fsnotify
      - codeberg.org/go-pdf/fpdf
      - github.com/go-git/go-git/v6

git:
  author:
    email: hello@happy-sdk.dev
    name: The Happy Authors
  branch: main
  remote:
    url: git@github.com:happy-sdk/happy.git

ignore:
  - pkg/logging/internal/bench
